name: Website acceptance
on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'README.md'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
      - run: npm ci --prefix qa
      - run: ./qa/node_modules/.bin/playwright install --with-deps chromium
      - name: Start isolated test fixture
        run: |
          npm run dev > /tmp/growth-site-test.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:5173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/growth-site-test.log
          exit 1
      - run: node qa/acceptance.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: website-review
          path: qa/results/
